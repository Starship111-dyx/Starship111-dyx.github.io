:root{--bg:#09090a;--surface:#121214;--surface2:#1a1a1d;--border:#252528;--border-faint:#1c1c1f;--accent:#ED1B24;--accent-dim:rgba(237,27,36,.25);--accent-faint:rgba(237,27,36,.08);--accent-glow:rgba(237,27,36,.35);--chrome:#8a8a90;--chrome-dim:#5a5a60;--chrome-bright:#aaaab0;--text:#eae6de;--text-body:#c8c3ba;--muted:#7a7670;--dim:#4d4a45;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(255,255,255,.022) 0%,transparent 70%),radial-gradient(ellipse 60% 80% at 30% 70%,rgba(255,255,255,.012) 0%,transparent 60%),var(--bg);color:var(--text-body);font-family:'LG1056','DM Mono',monospace;font-size:13px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + var(--safe-b))}
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.09}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.45' numOctaves='3' seed='7' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");opacity:.05}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.app{max-width:640px;margin:0 auto;padding:0 28px;position:relative;z-index:2}
.hero{padding:72px 0 40px;position:relative}
.hero-title{font-family:'Noto Serif SC',serif;font-size:clamp(36px,8.5vw,52px);font-weight:600;line-height:1.08;letter-spacing:.04em;color:var(--text);opacity:0;animation:rise .7s ease .2s forwards;display:flex;align-items:baseline;gap:0;flex-wrap:wrap}
.hero-title .hero-leica{font-family:'LG1056','DM Mono',monospace;font-size:clamp(32px,8vw,48px);font-weight:normal;letter-spacing:.35em;color:var(--text);display:inline-block;margin-right:16px;padding-right:16px;border-right:1px solid var(--border);line-height:1.08}
.hero-title .hero-m9{font-family:'LG1056','DM Mono',monospace;font-weight:normal;letter-spacing:.06em;margin-right:8px;color:var(--text)}
.hero-title .hero-lab{color:var(--text)}
.hero-title .red{color:var(--accent)}
.hero-en{font-family:'Syne',sans-serif;font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:18px;opacity:0;animation:rise .7s ease .3s forwards}
.section{padding:44px 0;position:relative}
.section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,#2a2a30 10%,#4a4a52 30%,#6a6a72 50%,#4a4a52 70%,#2a2a30 90%,transparent 100%)}
#uploadSection::before,#controlsSection::before,#previewSection::before{display:none}
.section-head{margin-bottom:24px}
.section-tag{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-tag::before{content:'';width:18px;height:1px;background:var(--accent)}
.section-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1.3;color:var(--text)}
.section-title em{font-style:normal;color:var(--chrome-bright)}
.section-desc{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7}
.shutter-flash{position:fixed;inset:0;z-index:300;background:#fff;opacity:0;pointer-events:none}
.upload-area{position:relative;border:1px solid var(--border);padding:48px 24px;text-align:center;cursor:pointer;transition:all .35s ease;background:var(--surface);-webkit-user-select:none;user-select:none}
.upload-area::after{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.02);pointer-events:none;transition:border-color .35s ease}
.upload-area:hover,.upload-area:active{border-color:var(--accent-dim);background:var(--surface2)}
.upload-area:hover::after{border-color:var(--accent-faint)}
.upload-area.dragover{border-color:var(--accent);background:rgba(237,27,36,.02)}
.upload-icon{position:relative;width:76px;height:50px;margin:0 auto 22px;transition:transform .4s ease}
.upload-area:hover .upload-icon{transform:scale(1.06)}
.vf-body{position:absolute;inset:0;border:1.5px solid var(--dim);border-radius:4px;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 35%,rgba(255,255,255,.02) 100%),var(--surface2);transition:border-color .3s ease,box-shadow .3s ease;overflow:hidden}
.vf-body::before{content:'';position:absolute;top:-60%;left:-30%;width:160%;height:200%;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.03) 47.5%,rgba(255,255,255,.05) 49.5%,rgba(255,255,255,.03) 51.5%,transparent 55%);pointer-events:none}
.vf-body::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 22px rgba(0,0,0,.5);border-radius:3px;pointer-events:none}
.upload-area:hover .vf-body{border-color:var(--accent-dim);box-shadow:0 0 24px rgba(237,27,36,.06)}
.vf-corner{position:absolute;width:14px;height:14px;pointer-events:none;z-index:1}
.vf-corner::before,.vf-corner::after{content:'';position:absolute;background:rgba(255,255,255,.3);transition:background .3s ease,box-shadow .3s ease}
.upload-area:hover .vf-corner::before,.upload-area:hover .vf-corner::after{background:rgba(237,27,36,.5)}
.vf-tl{top:7px;left:9px}.vf-tl::before{top:0;left:0;width:14px;height:1px}.vf-tl::after{top:0;left:0;width:1px;height:14px}
.vf-tr{top:7px;right:9px}.vf-tr::before{top:0;right:0;width:14px;height:1px}.vf-tr::after{top:0;right:0;width:1px;height:14px}
.vf-bl{bottom:7px;left:9px}.vf-bl::before{bottom:0;left:0;width:14px;height:1px}.vf-bl::after{bottom:0;left:0;width:1px;height:14px}
.vf-br{bottom:7px;right:9px}.vf-br::before{bottom:0;right:0;width:14px;height:1px}.vf-br::after{bottom:0;right:0;width:1px;height:14px}
.vf-fl{position:absolute;top:3px;right:11px;font-family:'DM Mono',monospace;font-size:6px;letter-spacing:.04em;color:rgba(255,255,255,.15);pointer-events:none;z-index:1;transition:color .3s ease}
.upload-area:hover .vf-fl{color:rgba(237,27,36,.4)}
.vf-fl2{position:absolute;bottom:3px;left:11px;font-family:'DM Mono',monospace;font-size:6px;letter-spacing:.04em;color:rgba(255,255,255,.1);pointer-events:none;z-index:1;transition:color .3s ease}
.upload-area:hover .vf-fl2{color:rgba(237,27,36,.3)}
.vf-patch{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:10px;border:1px solid rgba(237,27,36,.18);border-radius:1px;z-index:1;transition:all .3s ease}
.vf-patch::before{content:'';position:absolute;top:0;left:50%;width:1px;height:100%;background:rgba(255,255,255,.08);transition:background .3s ease}
.upload-area:hover .vf-patch{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow),0 0 4px rgba(237,27,36,.15);background:rgba(237,27,36,.06)}
.upload-area:hover .vf-patch::before{background:rgba(237,27,36,.2)}
.vf-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:3px;background:var(--accent);border-radius:50%;opacity:.35;z-index:2;transition:opacity .3s ease,box-shadow .3s ease}
.upload-area:hover .vf-dot{opacity:1;box-shadow:0 0 6px var(--accent-glow)}
.upload-label{font-family:'Syne',sans-serif;font-size:14px;font-weight:400;color:var(--text);margin-bottom:8px;transition:color .3s ease}
.upload-area:hover .upload-label{color:var(--accent)}
.upload-hint{font-size:9px;color:var(--dim);letter-spacing:.04em}
.upload-input{display:none}
.file-info{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:none;text-align:left}
.file-info.visible{display:block;animation:rise .4s ease forwards}
.file-info-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.file-info-row .fi-name{font-size:11px;color:var(--text);word-break:break-all;max-width:60%}
.file-info-row .fi-size{font-size:10px;color:var(--dim)}
.controls-section{padding:20px 0 12px}
.ctrl-group{margin-bottom:20px}
.ctrl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ctrl-label{font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctrl-val{font-size:11px;font-weight:400;color:rgba(237,27,36,.85);font-variant-numeric:tabular-nums}
.slider-zone{position:relative;padding:8px 0;margin:-8px 0}
.ctrl-slider{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;outline:none;touch-action:pan-y;cursor:pointer}
.ctrl-slider::-webkit-slider-runnable-track{height:10px;border-radius:3px;background:linear-gradient(to right,#131315 0%,#131315 var(--fs,0%),rgba(237,27,36,.65) var(--fs,0%),rgba(237,27,36,.65) var(--fe,0%),#131315 var(--fe,0%),#131315 100%);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(0,0,0,.25),0 .5px 0 rgba(255,255,255,.035)}

function updateFill(s){
  var mn=parseFloat(s.min),mx=parseFloat(s.max),v=parseFloat(s.value),rng=mx-mn;
  var vp=rng>0?((v-mn)/rng)*100:0,op=mn<0?((0-mn)/rng)*100:0;
  s.style.setProperty('--fs',Math.min(op,vp).toFixed(2)+'%');
  s.style.setProperty('--fe',Math.max(op,vp).toFixed(2)+'%');
}

function cancelSliderAnim(id){if(_sliderAnim[id]){cancelAnimationFrame(_sliderAnim[id].raf);_sliderAnim[id]=null}}
function animateSlider(id,veId,fmt,tgt,dur){
  return new Promise(function(resolve){cancelSliderAnim(id);
    var sl=$(id),ve=$(veId),sv=parseFloat(sl.value),df=tgt-sv;
    if(Math.abs(df)<0.5){sl.value=tgt;ve.textContent=fmt(tgt);updateFill(sl);resolve();return}
    var st=null,s={raf:null};_sliderAnim[id]=s;
    function step(ts){if(!st)st=ts;var t=Math.min((ts-st)/dur,1),e=1-Math.pow(2,-10*t),c=Math.round(sv+df*e);sl.value=c;ve.textContent=fmt(c);updateFill(sl);if(t<1)s.raf=requestAnimationFrame(step);else{sl.value=tgt;ve.textContent=fmt(tgt);updateFill(sl);_sliderAnim[id]=null;resolve()}}
    s.raf=requestAnimationFrame(step);
  });
}

function loadFile(f){

  $('fiSize').textContent=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB';
  $('fileInfo').classList.add('visible');

  rd.onload=function(e){var img=new Image();img.onload=function(){
    sourceImg=img;$('imgOrig').src=e.target.result;
    $('imgM9').src='';$('imgM9').classList.remove('img-reveal');$('imgM9').style.opacity='';$('phM9').style.display='';
    $('controlsSection').style.display='';$('previewSection').style.display='';

    setTimeout(function(){$('controlsSection').scrollIntoView({behavior:'smooth',block:'start'})},200);

var tick=function(){return new Promise(function(r){requestAnimationFrame(r)})};

  if(_ringTimer)cancelAnimationFrame(_ringTimer);_ringResolve=null;
  var ring=$('processRing'),pct=$('processPct'),start=null,dur=1500;
  pct.textContent='0';ring.style.background='conic-gradient(var(--accent) 0%,var(--border) 0%)';
  return new Promise(function(resolve){_ringResolve=resolve;
    function step(ts){if(!start)start=ts;var t=Math.min((ts-start)/dur,1),p=0.5-0.5*Math.cos(Math.PI*t),n=Math.min(Math.floor(p*100),100);
      ring.style.background='conic-gradient(var(--accent) '+(n*3.6)+'deg,var(--border) 0)';pct.textContent=n;
      if(t<1)_ringTimer=requestAnimationFrame(step);else{_ringTimer=null;if(_ringResolve){var r=_ringResolve;_ringResolve=null;r()}}}
    _ringTimer=requestAnimationFrame(step);

function stopRing(){if(_ringTimer){cancelAnimationFrame(_ringTimer);_ringTimer=null}$('processRing').style.background='conic-gradient(var(--accent) 360deg,var(--border) 0)';$('processPct').textContent='100';if(_ringResolve){var r=_ringResolve;_ringResolve=null;r()}}

  await tick();
